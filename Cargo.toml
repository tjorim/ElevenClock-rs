[workspace]
members = ["crates/clock-core", "crates/clock-windows", "crates/clock-app", "crates/clock-launcher", "crates/clock-bindgen"]
# Bare `cargo run`/`build`/`test` target the app; pass --workspace for every crate.
default-members = ["crates/clock-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.2.0"
publish = false
# Original Rust implementation (Apache-2.0). The inherited GPLv3 Python app was removed at cutover.
license = "Apache-2.0"
license-file = "LICENSE"

[profile.release]
# Retain matching PDBs as separate development artifacts, never in the installer.
debug = "line-tables-only"
strip = "none"

[workspace.dependencies]
clock-core = { path = "crates/clock-core" }
clock-windows = { path = "crates/clock-windows" }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
windows-core = "0.100.0"
windows-numerics = "0.100.0"
