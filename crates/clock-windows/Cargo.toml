[package]
name = "clock-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true

[dependencies]
chrono.workspace = true
clock-core.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
# Generated bindings in `src/bindings.rs` (see `clock-bindgen`) build on these two.
windows-core.workspace = true
windows-numerics.workspace = true

[dev-dependencies]
tempfile = "3.23"

# A custom main lets this target double as its own stand-in helper process.
[[test]]
name = "discovery_worker"
harness = false

# Same pattern: one executable plays runner, provider and UI Automation clients.
[[test]]
name = "uia_lifetime"
harness = false
