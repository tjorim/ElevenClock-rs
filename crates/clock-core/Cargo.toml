[package]
name = "clock-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
time.workspace = true

[dev-dependencies]
# RFC 3339 samples and an independent reference formatter in tests and benches;
# the library itself parses and formats no text dates through `time`.
time = { workspace = true, features = ["parsing", "formatting"] }
proptest = "1.9"
serde_json = "1.0"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "format"
harness = false

[[bench]]
name = "state"
harness = false
