# cargo-audit configuration. CI runs `cargo audit --deny warnings` from the
# repository root; every exception here needs a dated rationale, and the
# matching entry in docs/dependencies.md ("Advisory exceptions").

[advisories]
ignore = [
    # 2026-11-21: chrono is flagged unmaintained (informational, all versions
    # affected, no patched release: https://github.com/chronotope/chrono/issues/1768).
    # It is the date/time type behind the format language and clock state in
    # clock-core and clock-windows, with no known vulnerability. Re-evaluate
    # when upstream resumes maintenance or when migrating to jiff or time
    # (tracked in https://github.com/tjorim/ElevenClock-rs/issues/177).
    "RUSTSEC-2026-0543",
]
