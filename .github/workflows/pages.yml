name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/icon.svg', 'assets/icon.png', 'docs/design/images/settings/first-run.png', '.github/workflows/pages.yml']
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The page reuses the app icon and a Settings screenshot instead of copies.
      - name: Assemble the site
        run: |
          mkdir _site
          cp site/* _site/
          cp assets/icon.svg assets/icon.png _site/
          cp docs/design/images/settings/first-run.png _site/settings.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
