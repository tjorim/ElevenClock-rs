version: 2
# Updates target the default branch (main), which builds only the Rust app.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # `windows`, `windows-core` and `windows-numerics` must move in lockstep:
      # mixing versions gives two incompatible `windows_core::Interface` traits.
      windows:
        patterns: ["windows", "windows-*"]
    ignore:
      # Published ahead of `windows` itself (still on 0.62). Drop once
      # `windows` 0.100 ships so the group can move all three together.
      - dependency-name: "windows-core"
        versions: [">=0.100"]
      - dependency-name: "windows-numerics"
        versions: [">=0.100"]
      # 0.8 pulls in `alloca` (needs a C compiler for the MSVC cross-clippy on
      # Linux) and `winapi-*-gnu` (ships no license files, fails the notice check).
      - dependency-name: "criterion"
        versions: [">=0.8"]
