version: 2
# Updates target the default branch (main), which builds only the Rust app.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # `windows-bindgen` generates code against `windows-core` and
      # `windows-numerics`; all three move in lockstep, with the bindings
      # regenerated in the same PR (CI fails if they are stale).
      windows:
        patterns: ["windows-*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot runs pnpm with --config.minimum-release-age=4320 (3 days). Without a matching
    # cooldown it proposes releases younger than that, pnpm refuses them for transitive
    # dependencies (@babel/*, undici, ...) and the job fails with dependency_file_not_resolvable.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    groups:
      # astro and its @astrojs packages are pinned together and must move together.
      astro:
        patterns: ["astro", "@astrojs/*"]
